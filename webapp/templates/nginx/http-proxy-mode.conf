            
            proxy_redirect          https://{{HOST-HEADER}}/ https://{{DOMAIN}}/;
            proxy_redirect          http://{{HOST-HEADER}}/  https://{{DOMAIN}}/;
            proxy_cookie_domain     {{HOST-HEADER}} {{DOMAIN}};
            
            set $upstream_origin $http_origin;
            if ($http_origin = "https://{{DOMAIN}}") {
                set $upstream_origin "https://{{HOST-HEADER}}";
            }
            proxy_set_header Origin $upstream_origin;
  